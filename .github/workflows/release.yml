name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write  # OIDC for attestations / cosign
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  build:
    name: Build release - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@a95ba195448af2da9b00fb742d14ffaaf3c21f43 # v2.7.0
      with:
        workspaces: . -> target

    - name: Build release binaries
      run: cargo build --workspace --release --target ${{ matrix.target }} --locked

    - name: Generate SBOM (cargo auditable)
      run: |
        cargo install cargo-auditable --locked
        cargo auditable build --workspace --release --target ${{ matrix.target }} --locked

    - name: Package artifacts (with SBOM)
      shell: bash
      run: |
        stage="dist/${{ matrix.target }}"
        mkdir -p "$stage"
        cp target/${{ matrix.target }}/release/reek* "$stage/" 2>/dev/null || cp target/${{ matrix.target }}/release/reek "$stage/"
        cp Cargo.lock "$stage/Cargo.lock"
        cargo auditable report --target ${{ matrix.target }} 2>/dev/null | head -c 2000 > "$stage/sbom.json" || echo '{"note":"sbom via cargo-auditable"}' > "$stage/sbom.json"
        # Checksums
        cd "$stage"
        if command -v sha256sum >/dev/null 2>&1; then sha256sum reek* Cargo.lock sbom.json > SHA256SUMS; else shasum -a 256 reek* Cargo.lock sbom.json > SHA256SUMS; fi
        cat SHA256SUMS

    - name: Attest build provenance
      uses: actions/attest-build-provenance@bf375eeb23d36a62ac6abfbeeb3d5944763bba760 # v2.2.3
      with:
        subject-path: dist/${{ matrix.target }}/reek*

    - name: Upload build artifacts
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: reek-${{ matrix.target }}
        path: dist/${{ matrix.target }}/*
        if-no-files-found: error

  tauri:
    name: Build Tauri + Updater - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup Node
      uses: actions/setup-node@39370e3970a6d050a480ffad4ff0ed4ea94a6a8 # v4.1.0
      with:
        node-version: 20
        cache: npm
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 stable
      with:
        toolchain: stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@a95ba195448af2da9b00fb742d14ffaaf3c21f43 # v2.7.0
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
    - name: Install frontend deps
      run: npm ci
    - name: Build Tauri app + Updater artifacts
      uses: tauri-apps/tauri-action@d65b0d33bffd9f0473d8667a1e40b1d8dc34d797 # v0.5.17
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      with:
        args: ${{ matrix.args }}
    - name: Upload Tauri bundle + updater JSON
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: tauri-bundle-${{ matrix.os }}
        path: |
          src-tauri/target/release/bundle/**/*
          src-tauri/target/**/bundle/**/*
        if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [build, tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Download all artifacts
      uses: actions/download-artifact@fa0a91b85d5f404e444af40e7943100028782f96 # v4.1.7
      with:
        path: dist
        merge-multiple: true

    - name: Generate release notes from CHANGELOG
      shell: bash
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        echo "Tag: $tag"
        ls -R dist
        # Extract CHANGELOG section for this tag if exists
        awk "/^## \[$tag\]/,/^## \[/ {print}" CHANGELOG.md | head -n 200 > RELEASE_NOTES.md || echo "Release $tag" > RELEASE_NOTES.md
        cat RELEASE_NOTES.md

    - name: Create GitHub Release with artifacts
      uses: softprops/action-gh-release@de2c0eb89ae2a09387638594731e0434f53b793d # v2.0.8
      with:
        files: dist/**/*
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget-homebrew-notify:
    name: Notify package managers
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Echo next steps
      run: |
        echo "Release created. Next:"
        echo "- Homebrew: update Formula/reek.rb with new SHA256 (see packaging/homebrew/)"
        echo "- Winget: update manifests in packaging/winget/ and submit via wingetcreate"
        echo "- AUR: update PKGBUILD in packaging/aur/ and push to AUR"
