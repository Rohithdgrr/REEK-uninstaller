name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  # Pin dependency resolution to the committed Cargo.lock (reproducible builds).
  CARGO_NET_RETRY: "10"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (fmt, clippy, test) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        components: [rustfmt, clippy]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 stable
      with:
        toolchain: stable
        components: ${{ join(matrix.components, ',') }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@cf9339e04bb8069e37c71ff4a0e6a970f35d6f7d # v2.7.0
      with:
        workspaces: . -> target

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --workspace --all-features --locked

  msrv:
    name: MSRV (1.78.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install Rust toolchain (MSRV)
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 stable
      with:
        toolchain: 1.78.0

    - name: Cache cargo
      uses: Swatinem/rust-cache@cf9339e04bb8069e37c71ff4a0e6a970f35d6f7d # v2.7.0

    - name: Build workspace
      run: cargo check --workspace --all-features --locked

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@cf9339e04bb8069e37c71ff4a0e6a970f35d6f7d # v2.7.0

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run cargo-audit
      run: cargo audit

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Run cargo-deny
      run: cargo deny check advisories bans licenses sources

  build:
    name: Build release - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@cf9339e04bb8069e37c71ff4a0e6a970f35d6f7d # v2.7.0
      with:
        workspaces: . -> target

    - name: Build release binaries
      run: cargo build --workspace --release --target ${{ matrix.target }} --locked

    - name: Upload build artifacts
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: reek-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/reek*
        if-no-files-found: error

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install Rust toolchain (with llvm-tools)
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 stable
      with:
        components: llvm-tools-preview

    - name: Cache cargo
      uses: Swatinem/rust-cache@cf9339e04bb8069e37c71ff4a0e6a970f35d6f7d # v2.7.0

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov --locked --version 0.8.7

    - name: Generate coverage report
      run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

    - name: Upload lcov report
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: lcov.info
        path: lcov.info
        if-no-files-found: error

    # Regression floor, raised as coverage grows (target: 80%+).
    - name: Enforce coverage floor
      run: cargo llvm-cov report --fail-under-lines 30

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@cf9339e04bb8069e37c71ff4a0e6a970f35d6f7d # v2.7.0

    - name: Build documentation
      run: cargo doc --workspace --all-features --no-deps --locked

    - name: Check no broken intra-doc links
      run: cargo doc --workspace --all-features --no-deps --locked 2>&1 | grep -E "warning: unresolved" && exit 1 || exit 0