[package]
name = "greek-platform"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
greek-windows = ["dep:greek-windows"]

[dependencies]
greek-common = { path = "../greek-common", version = "0.1.0" }
greek-windows = { path = "../greek-windows", version = "0.1.0", optional = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
color-eyre = { workspace = true }

# Tracing
tracing = { workspace = true }

# Unix/Linux
[target.'cfg(unix)'.dependencies]
libc = "0.2"
