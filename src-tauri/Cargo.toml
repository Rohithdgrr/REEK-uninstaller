[package]
name = "reek-uninstaller"
version = "0.1.0"
description = "REEK Uninstaller - premium Tauri desktop app"
authors = ["Greek Team"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
greek-common = { path = "../crates/greek-common" }
greek-core = { path = "../crates/greek-core" }
greek-windows = { path = "../crates/greek-windows" }
humansize = "2.1.3"
base64 = "0.22"
