[workspace]
members = [
    "crates/greek-common",
    "crates/greek-core",
    "crates/greek-tui",
    "crates/greek-cli",
    "crates/greek-windows",
    "crates/greek-platform",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Greek Team <team@greek.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/REEK-uninstaller"
rust-version = "1.88.0"

[workspace.dependencies]
# Async
tokio = { version = "1.39.2", features = ["full"] }
futures = "0.3.30"
async-trait = "0.1.81"

# Error handling
thiserror = "1.0.63"
color-eyre = "0.6.3"

# Serialization
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
toml = "0.8.19"

# Tracing
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"

# IDs & Time
uuid = { version = "1.10.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }

# Collections
indexmap = "2.2.6"
dashmap = "6.0.1"

# Testing
tempfile = "3.12.0"
mockall = "0.13.0"
criterion = { version = "0.5.1", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-windows]
inherits = "release"
lto = "fat"
