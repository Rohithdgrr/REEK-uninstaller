# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# All vulnerability/unsound/notice advisories are treated as errors by default.
# What happens when a crate with a yanked version is encountered.
yanked = "deny"
# Unmaintained advisories fail if they apply to a workspace crate (direct dep).
unmaintained = "workspace"
# A list of advisory IDs to ignore (only for triaged false positives / no fix available)
ignore = []

[licenses]
# All licenses are denied unless explicitly listed in `allow`.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSL-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
]
# Lint level used when a license in `allow` is not actually used in the graph.
unused-allowed-license = "warn"
# Askalono confidence required to accept a detected license.
confidence-threshold = 0.8
# Workspace crates carry the workspace MIT OR Apache-2.0 license.
[licenses.private]
ignore = true

[bans]
# Lint level for when multiple versions of the same crate are detected.
# Kept at "warn" because the dependency tree legitimately contains multiple
# major versions of transitive crates (e.g. thiserror 1.x + 2.x, windows-sys).
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "deny"
# The graph highlighting used when creating dotgraphs for crates
highlight = "all"
# List of crates that are allowed
allow = []
# List of crates to deny
deny = []
# Certain crates/versions that will be skipped when doing duplicate detection
skip = []
# Similarly named crates that are allowed
skip-tree = []

[sources]
# Lint level for what to happen when a crate from a crate registry that is not in the allow list is encountered
unknown-registry = "deny"
# Lint level for what to happen when a crate from a git repository that is not in the allow list is encountered
unknown-git = "deny"
# List of URLs for allowed crate registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
allow-git = []
